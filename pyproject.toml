[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF059"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["app.py", "applications.py", "ollama_local.py", "operations.py", "organizer.py", "scanner.py", "undo.py"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["app", "applications", "ollama_local", "operations", "organizer", "scanner", "undo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
