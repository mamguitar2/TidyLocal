[project]
name = "tidylocal"
version = "0.1.0"
description = "Local-first macOS file organizer with safe previews and reversible operations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["macOS", "file organizer", "local-first", "file safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "send2trash>=1.8,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "httpx2>=2,<3",
    "ruff>=0.11,<1",
    "mypy>=1.10,<2",
    "types-Send2Trash>=1.8,<2",
]

[project.urls]
Homepage = "https://github.com/mamguitar2/TidyLocal"
Repository = "https://github.com/mamguitar2/TidyLocal"
Issues = "https://github.com/mamguitar2/TidyLocal/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF059"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["app.py", "applications.py", "ollama_local.py", "operations.py", "organizer.py", "scanner.py", "undo.py"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["app", "applications", "ollama_local", "operations", "organizer", "scanner", "undo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
