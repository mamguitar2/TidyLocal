name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.lock
      - name: Create project environment
        run: python -m venv .venv
      - name: Install locked development dependencies
        run: .venv/bin/python -m pip install -r requirements-dev.lock
      - name: Ruff lint
        run: .venv/bin/python -m ruff check .
      - name: Ruff format check
        run: .venv/bin/python -m ruff format --check .
      - name: Mypy type check
        run: .venv/bin/python -m mypy
      - name: Tests and coverage
        run: .venv/bin/python -m pytest --cov --cov-report=term-missing
